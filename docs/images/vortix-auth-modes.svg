<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="390" viewBox="0 0 1160 390" role="img" aria-labelledby="title desc">
  <title id="title">Autenticação no Vortix</title>
  <desc id="desc">Bearer, Basic Auth e API Key: campos, headers e proteção de credenciais locais.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1b2b"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9b6bff"/><stop offset="1" stop-color="#673ab7"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#54d6b2"/><stop offset="1" stop-color="#168f9b"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffbd69"/><stop offset="1" stop-color="#ec7c4b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1160" height="390" rx="26" fill="url(#bg)"/>
  <circle cx="1080" cy="35" r="100" fill="#8b5cf6" opacity=".08"/>
  <circle cx="50" cy="360" r="120" fill="#2dd4bf" opacity=".06"/>
  <text x="52" y="62" fill="#7ddac1" font-family="Fira Code, monospace" font-size="13" font-weight="700" letter-spacing="2">VORTIX  /  AUTH</text>
  <text x="52" y="98" fill="#f6f2ff" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="750">Escolha como cada request se autentica</text>
  <text x="52" y="126" fill="#a5b0c5" font-family="Inter, Segoe UI, sans-serif" font-size="15">Use variáveis de ambiente e controle quando credenciais ficam salvas.</text>

  <g filter="url(#shadow)">
    <rect x="52" y="154" width="334" height="176" rx="18" fill="#242336" stroke="#6e55a9"/>
    <rect x="52" y="154" width="7" height="176" rx="3.5" fill="url(#purple)"/>
    <circle cx="88" cy="190" r="17" fill="#8b5cf6" opacity=".2"/>
    <text x="81" y="196" fill="#c8afff" font-family="Fira Code, monospace" font-size="18" font-weight="700">B</text>
    <text x="116" y="195" fill="#fff" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700">Bearer</text>
    <text x="78" y="232" fill="#aeb7ca" font-family="Inter, Segoe UI, sans-serif" font-size="14">Token direto ou do ambiente</text>
    <rect x="78" y="249" width="282" height="50" rx="9" fill="#191827" stroke="#39364f"/>
    <text x="94" y="271" fill="#bba4ff" font-family="Fira Code, monospace" font-size="12">Authorization</text>
    <text x="94" y="289" fill="#e7ddff" font-family="Fira Code, monospace" font-size="12">Bearer {{token}}</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="413" y="154" width="334" height="176" rx="18" fill="#1e2c31" stroke="#2d7677"/>
    <rect x="413" y="154" width="7" height="176" rx="3.5" fill="url(#teal)"/>
    <circle cx="449" cy="190" r="17" fill="#2dd4bf" opacity=".18"/>
    <text x="442" y="196" fill="#75e4cf" font-family="Fira Code, monospace" font-size="18" font-weight="700">U</text>
    <text x="477" y="195" fill="#fff" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700">Basic Auth</text>
    <text x="439" y="232" fill="#aebfc4" font-family="Inter, Segoe UI, sans-serif" font-size="14">Usuário e senha em campos próprios</text>
    <rect x="439" y="249" width="282" height="50" rx="9" fill="#152126" stroke="#315052"/>
    <text x="455" y="271" fill="#78ddca" font-family="Fira Code, monospace" font-size="12">Authorization</text>
    <text x="455" y="289" fill="#d5fff5" font-family="Fira Code, monospace" font-size="12">Basic • gerado ao enviar</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="774" y="154" width="334" height="176" rx="18" fill="#302a27" stroke="#926043"/>
    <rect x="774" y="154" width="7" height="176" rx="3.5" fill="url(#amber)"/>
    <circle cx="810" cy="190" r="17" fill="#fb923c" opacity=".2"/>
    <text x="803" y="196" fill="#ffc17f" font-family="Fira Code, monospace" font-size="18" font-weight="700">K</text>
    <text x="838" y="195" fill="#fff" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700">API Key</text>
    <text x="800" y="232" fill="#c8b9ad" font-family="Inter, Segoe UI, sans-serif" font-size="14">Header recomendado · query opcional</text>
    <rect x="800" y="249" width="282" height="50" rx="9" fill="#241f1d" stroke="#534137"/>
    <text x="816" y="271" fill="#ffc17f" font-family="Fira Code, monospace" font-size="12">X-API-Key</text>
    <text x="816" y="289" fill="#ffebd2" font-family="Fira Code, monospace" font-size="12">{{apiKey}}</text>
  </g>

  <rect x="52" y="347" width="1056" height="1" fill="#ffffff" opacity=".12"/>
  <circle cx="60" cy="368" r="5" fill="#54d6b2"/>
  <text x="76" y="373" fill="#b8c5d3" font-family="Inter, Segoe UI, sans-serif" font-size="13">Salvar no SQLite é opcional; campos sensíveis usam proteção local.</text>
  <circle cx="740" cy="368" r="5" fill="#ffbd69"/>
  <text x="756" y="373" fill="#b8c5d3" font-family="Inter, Segoe UI, sans-serif" font-size="13">Segredos em query podem aparecer nos logs da API.</text>
</svg>