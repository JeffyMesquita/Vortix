<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">OAuth 2.0 Client Credentials no Vortix</title>
  <desc id="desc">Configura endpoint e scopes, envia client credentials por Basic ou formulário e salva opcionalmente o access token no ambiente.</desc>
  <rect width="1200" height="360" rx="18" fill="#20232b"/>
  <text x="48" y="52" fill="#f1f3f7" font-family="Fira Code,monospace" font-size="22" font-weight="700">OAuth 2.0 · Client Credentials</text>
  <text x="48" y="78" fill="#aab3c2" font-family="Fira Code,monospace" font-size="12">client_secret efêmero · token por ambiente · validade visível</text>

  <rect x="48" y="112" width="332" height="200" rx="12" fill="#292d38" stroke="#5a536f"/>
  <circle cx="78" cy="143" r="15" fill="#bd93f9"/><text x="74" y="148" fill="#211d2b" font-family="Fira Code,monospace" font-size="13" font-weight="700">1</text>
  <text x="104" y="148" fill="#f8f8f2" font-family="Fira Code,monospace" font-size="15" font-weight="700">Configurar</text>
  <text x="70" y="188" fill="#bdb5d5" font-family="Fira Code,monospace" font-size="12">Endpoint e Client ID</text>
  <text x="70" y="213" fill="#bdb5d5" font-family="Fira Code,monospace" font-size="12">Scopes por ambiente</text>
  <text x="70" y="254" fill="#8ce3d3" font-family="Fira Code,monospace" font-size="11">client_secret: só na sessão</text>
  <text x="70" y="278" fill="#8ce3d3" font-family="Fira Code,monospace" font-size="11">HTTPS; HTTP local permitido</text>

  <path d="M392 211h40m-10-8 10 8-10 8" fill="none" stroke="#8ce3d3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="440" y="112" width="332" height="200" rx="12" fill="#292d38" stroke="#435c58"/>
  <circle cx="470" cy="143" r="15" fill="#8ce3d3"/><text x="466" y="148" fill="#1c2927" font-family="Fira Code,monospace" font-size="13" font-weight="700">2</text>
  <text x="496" y="148" fill="#f8f8f2" font-family="Fira Code,monospace" font-size="15" font-weight="700">Solicitar</text>
  <text x="462" y="188" fill="#c4ccd6" font-family="Fira Code,monospace" font-size="12">POST · form-urlencoded</text>
  <text x="462" y="213" fill="#d6bd75" font-family="Fira Code,monospace" font-size="11">grant_type=client_credentials</text>
  <text x="462" y="254" fill="#c4ccd6" font-family="Fira Code,monospace" font-size="11">client_secret_basic</text>
  <text x="462" y="278" fill="#c4ccd6" font-family="Fira Code,monospace" font-size="11">ou client_secret_post</text>

  <path d="M784 211h40m-10-8 10 8-10 8" fill="none" stroke="#bd93f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="832" y="112" width="320" height="200" rx="12" fill="#292d38" stroke="#5a536f"/>
  <circle cx="862" cy="143" r="15" fill="#bd93f9"/><text x="858" y="148" fill="#211d2b" font-family="Fira Code,monospace" font-size="13" font-weight="700">3</text>
  <text x="888" y="148" fill="#f8f8f2" font-family="Fira Code,monospace" font-size="15" font-weight="700">Usar e renovar</text>
  <text x="854" y="188" fill="#c4ccd6" font-family="Fira Code,monospace" font-size="12">access_token → {{token}}</text>
  <text x="854" y="213" fill="#c4ccd6" font-family="Fira Code,monospace" font-size="12">Salvar no ambiente ativo</text>
  <text x="854" y="254" fill="#8ce3d3" font-family="Fira Code,monospace" font-size="11">expires_in → status de validade</text>
  <text x="854" y="278" fill="#8ce3d3" font-family="Fira Code,monospace" font-size="11">Obter novo token manualmente</text>
</svg>