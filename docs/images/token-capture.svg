<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="210" viewBox="0 0 1100 210" role="img" aria-labelledby="title desc">
  <title id="title">Captura e reutilizacao local de token</title>
  <desc id="desc">A resposta de autenticacao salva access_token no ambiente; a proxima request usa {{token}}.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#82d9bd"/></marker></defs>
  <rect x="1" y="1" width="1098" height="208" rx="18" fill="#1b2028" stroke="#303844"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="24" y="35" width="230" height="138" rx="12" fill="#222832" stroke="#3a4654"/>
    <text x="44" y="64" fill="#ffad66" font-size="12" font-weight="700" letter-spacing="1">AUTENTICACAO</text>
    <text x="44" y="94" fill="#82d9bd" font-family="Consolas,monospace" font-size="15">POST /oauth/token</text>
    <text x="44" y="122" fill="#c4ccd6" font-family="Consolas,monospace" font-size="12">{ &quot;grant_type&quot;: ... }</text>
    <text x="44" y="150" fill="#8793a1" font-size="12">Captura: access_token</text>
    <path d="M272 104h68" stroke="#82d9bd" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="360" y="54" width="190" height="100" rx="12" fill="#173b34" stroke="#2e806c"/>
    <text x="380" y="84" fill="#a8e8d5" font-size="12" font-weight="700">AMBIENTE ATIVO</text>
    <text x="380" y="118" fill="#82d9bd" font-family="Consolas,monospace" font-size="16">token = ...</text>
    <path d="M568 104h68" stroke="#82d9bd" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="656" y="35" width="420" height="138" rx="12" fill="#222832" stroke="#3a4654"/>
    <text x="680" y="64" fill="#b799ff" font-size="12" font-weight="700" letter-spacing="1">PROXIMA REQUEST</text>
    <text x="680" y="96" fill="#82d9bd" font-family="Consolas,monospace" font-size="15">GET /v1/profile</text>
    <text x="680" y="126" fill="#c4ccd6" font-family="Consolas,monospace" font-size="13">Authorization: Bearer <tspan fill="#d6bd75">{{token}}</tspan></text>
    <text x="680" y="152" fill="#8793a1" font-size="12">O token fica local e nao e exportado por padrao.</text>
  </g>
</svg>