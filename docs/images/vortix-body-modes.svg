<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc">
  <title id="title">Formatos de body suportados pelo Vortix</title>
  <desc id="desc">Quatro exemplos coloridos: JSON, texto simples, XML e formulário URL-encoded.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#211c35"/><stop offset="1" stop-color="#151923"/></linearGradient>
    <linearGradient id="json" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="plain" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="xml" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <linearGradient id="form" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#059669"/></linearGradient>
  </defs>
  <rect width="1120" height="340" rx="24" fill="url(#background)"/>
  <circle cx="1070" cy="24" r="124" fill="#8b5cf6" opacity=".08"/>
  <text x="44" y="48" fill="#8ce5cf" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">REQUEST BODY</text>
  <text x="44" y="82" fill="#f7f4ff" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Escolha o formato. O Vortix cuida do Content-Type.</text>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="44" y="108" width="240" height="184" rx="16" fill="#27233a" stroke="#5b4b83"/>
    <rect x="44" y="108" width="240" height="6" rx="3" fill="url(#json)"/>
    <text x="64" y="145" fill="#c4b5fd" font-size="17" font-weight="700">JSON</text>
    <text x="64" y="169" fill="#9ca3b2" font-family="Consolas,monospace" font-size="10">application/json</text>
    <rect x="60" y="188" width="208" height="78" rx="9" fill="#191a26"/>
    <text x="76" y="219" fill="#c4b5fd" font-family="Consolas,monospace" font-size="13">{</text>
    <text x="91" y="239" fill="#a7f3d0" font-family="Consolas,monospace" font-size="13">"name": "Ana"</text>
    <text x="76" y="257" fill="#c4b5fd" font-family="Consolas,monospace" font-size="13">}</text>
    <rect x="308" y="108" width="240" height="184" rx="16" fill="#1e2b35" stroke="#316a79"/>
    <rect x="308" y="108" width="240" height="6" rx="3" fill="url(#plain)"/>
    <text x="328" y="145" fill="#67e8f9" font-size="17" font-weight="700">Texto</text>
    <text x="328" y="169" fill="#9ca3b2" font-family="Consolas,monospace" font-size="10">text/plain</text>
    <rect x="324" y="188" width="208" height="78" rx="9" fill="#171e27"/>
    <text x="340" y="232" fill="#a5f3fc" font-family="Consolas,monospace" font-size="13">Olá, API!</text>
    <rect x="572" y="108" width="240" height="184" rx="16" fill="#33291e" stroke="#79572b"/>
    <rect x="572" y="108" width="240" height="6" rx="3" fill="url(#xml)"/>
    <text x="592" y="145" fill="#fcd34d" font-size="17" font-weight="700">XML</text>
    <text x="592" y="169" fill="#b7a994" font-family="Consolas,monospace" font-size="10">application/xml</text>
    <rect x="588" y="188" width="208" height="78" rx="9" fill="#241f1a"/>
    <text x="604" y="222" fill="#fdba74" font-family="Consolas,monospace" font-size="12">&lt;user&gt;</text>
    <text x="620" y="242" fill="#fde68a" font-family="Consolas,monospace" font-size="12">&lt;name&gt;Ana&lt;/name&gt;</text>
    <text x="604" y="260" fill="#fdba74" font-family="Consolas,monospace" font-size="12">&lt;/user&gt;</text>
    <rect x="836" y="108" width="240" height="184" rx="16" fill="#1e302c" stroke="#326a56"/>
    <rect x="836" y="108" width="240" height="6" rx="3" fill="url(#form)"/>
    <text x="856" y="145" fill="#6ee7b7" font-size="17" font-weight="700">Form URL-encoded</text>
    <text x="856" y="169" fill="#9ca3b2" font-family="Consolas,monospace" font-size="9">application/x-www-form-urlencoded</text>
    <rect x="852" y="188" width="208" height="78" rx="9" fill="#17231f"/>
    <text x="868" y="222" fill="#a7f3d0" font-family="Consolas,monospace" font-size="12">name=Ana</text>
    <text x="868" y="244" fill="#a7f3d0" font-family="Consolas,monospace" font-size="12">tag=one&amp;tag=two</text>
  </g>
  <text x="44" y="319" fill="#9aa3b2" font-family="Segoe UI,Arial,sans-serif" font-size="11">Content-Type pode ser ajustado em Headers. Multipart e GraphQL estão no roadmap.</text>
</svg>
