services:
  - type: web
    name: vortix-api-client
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    domains:
      - vortixapiclient.jeffymesquita.dev
    envVars:
      - key: ApiStudio__HostingMode
        value: render
      - key: ApiStudio__PublicOrigin
        value: https://vortixapiclient.jeffymesquita.dev
