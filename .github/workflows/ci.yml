name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Restore and build
        run: |
          dotnet restore ./VortixApiClient.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build ./VortixApiClient.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: JavaScript tests
        run: node --test ./RunnerLogic.test.cjs ./VortixRunner.test.cjs ./AIFriendlyUi.test.cjs ./AIAgentBridge.test.cjs

      - name: PowerShell integration tests
        shell: pwsh
        run: |
          $tests = @(
            './HostingMode.test.ps1',
            './WorkspaceProtection.test.ps1',
            './AuthorizationCodePkce.test.ps1',
            './HistoryRetention.test.ps1',
            './GraphqlIntrospection.test.ps1'
          )
          foreach ($test in $tests) {
            Write-Host "Running $test"
            & powershell -NoProfile -ExecutionPolicy Bypass -File $test
            if ($LASTEXITCODE -ne 0) { throw "$test failed with exit code $LASTEXITCODE" }
          }
